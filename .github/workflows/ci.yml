name: CI

# Guards the V2-Mock app: lint, tests, and a production build must pass before
# a change lands. Scoped to V2-Mock/** so unrelated changes don't trigger it.
on:
  pull_request:
    branches: [main]
    paths:
      - "V2-Mock/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "V2-Mock/**"
      - ".github/workflows/ci.yml"

# One run per ref; a new push cancels an in-flight run for the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V2-Mock
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: V2-Mock/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
